name: App Factory Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-factory-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-factory-gate:
    name: app-factory-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9

      - name: Compile App Factory Core
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/factory/detect_project.py \
            scripts/factory/bootstrap_project.py \
            scripts/factory/test_factory.py

      - name: Run offline adversarial qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/factory/test_factory.py

      - name: Confirm fail-closed factory defaults
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              out=subprocess.check_output([sys.executable,'scripts/factory/bootstrap_project.py',tmp], text=True)
              manifest=json.loads(out.split('\n[PLAN]',1)[0])
              assert manifest['skills']['publication_enabled'] is False
              assert manifest['security']['target_git_config_execution_allowed'] is False
              assert manifest['execution']['autonomous_project_writer_enabled'] is False
              assert manifest['execution']['production_write_enabled'] is False
              assert manifest['execution']['production_secrets_allowed'] is False
              assert manifest['spacecraft']['source_commit_is_authorization'] is False
          print('[PASS] App Factory defaults remain fail-closed.')
          PY
