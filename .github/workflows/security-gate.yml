name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: security-gate
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Verify control plane
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Install pinned security tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/security/install-security-tools.ps1

      - name: Run full security gate
        shell: pwsh
        run: ./scripts/security/run-security.ps1 full
