name: Writer Qualification Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-qualification-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  writer-qualification-gate:
    name: writer-qualification-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate qualification source syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/isolation/linux/install-codex-pinned.sh
          bash -n scripts/isolation/linux/writer-sandbox-exec.sh
          bash -n scripts/isolation/linux/credential-boundary-test.sh
          bash -n scripts/isolation/linux/probe-codex-pinned.sh
          bash -n scripts/isolation/linux/composed-fake-canary-test.sh
          bash -n scripts/isolation/linux/qualification-preflight.sh
          python3 -m py_compile scripts/isolation/linux/runtime-tree-manifest.py

      - name: Validate qualification policy and locks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/isolation/linux/qualification-preflight.sh

      - name: Install exact pinned Codex Linux runtime without executing it
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/isolation/linux/install-codex-pinned.sh

      - name: Validate complete installed Codex runtime tree
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/isolation/linux/qualification-preflight.sh --installed

      - name: Probe Codex version only as isolated unprivileged principal
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/isolation/linux/probe-codex-pinned.sh

      - name: Run concurrent controller credential boundary inside writer namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/isolation/linux/credential-boundary-test.sh

      - name: Run composed fake Codex writer canary end to end
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/isolation/linux/composed-fake-canary-test.sh

      - name: Confirm no real writer execution occurred
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('registry/writer-qualification-v1.json').read_text())
          assert p['policy_version'] == '1.3.0'
          assert p['project_writer_execution_enabled'] is False
          assert p['real_writer_canary_enabled'] is False
          assert p['credential_boundary']['status'] == 'not-yet-qualified'
          assert p['merge_controls']['security_control_approval_gate_status'] == 'activation-required-not-preflight-merge-required'
          assert p['merge_controls']['required_check_integration_id'] == 15368
          assert p['canary']['composed_fake_end_to_end_required_before_real_canary'] is True
          assert p['activation']['requires_composed_fake_end_to_end_gate'] is True
          print('[PASS] Real writer canary and project execution remain blocked after composed fake qualification.')
          PY

      - name: Cleanup qualification runtime and disposable state
        if: always()
        shell: bash
        run: |
          set +e
          sudo pkill -KILL -u mk-writer 2>/dev/null || true
          sudo rm -rf --one-file-system /opt/mk-spacecraft/runtime/codex/0.146.0
          sudo find /opt/mk-spacecraft/runtime/codex -maxdepth 1 -type d -name '.staging-0.146.0-*' -exec rm -rf --one-file-system {} + 2>/dev/null || true
          sudo find /var/lib/mk-spacecraft -maxdepth 1 -type d \( -name 'credential-boundary.*' -o -name 'codex-probe.*' -o -name 'composed-canary.*' \) -exec rm -rf --one-file-system {} + 2>/dev/null || true
          sudo find /tmp -maxdepth 1 -type d -name 'mk-codex-install.*' -exec rm -rf --one-file-system {} + 2>/dev/null || true
          getent passwd | awk -F: '/^mk-(controller|writer|codex-probe)-q-/ {print $1}' | while read -r user; do sudo userdel "$user" 2>/dev/null || true; done

      - name: Verify qualification cleanup residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if getent passwd | grep -Eq '^mk-(controller|writer|codex-probe)-q-'; then
            echo '[BLOCK] Disposable qualification principal residue remains.' >&2
            getent passwd | grep -E '^mk-(controller|writer|codex-probe)-q-' >&2 || true
            exit 1
          fi
          if [[ -e /opt/mk-spacecraft/runtime/codex/0.146.0 || -L /opt/mk-spacecraft/runtime/codex/0.146.0 ]]; then
            echo '[BLOCK] Qualification Codex runtime residue remains.' >&2
            exit 1
          fi
          if find /opt/mk-spacecraft/runtime/codex -maxdepth 1 -type d -name '.staging-0.146.0-*' -print -quit 2>/dev/null | grep -q .; then
            echo '[BLOCK] Codex staging residue remains.' >&2
            exit 1
          fi
          if find /var/lib/mk-spacecraft -maxdepth 1 -type d \( -name 'credential-boundary.*' -o -name 'codex-probe.*' -o -name 'composed-canary.*' \) -print -quit 2>/dev/null | grep -q .; then
            echo '[BLOCK] Qualification state residue remains.' >&2
            exit 1
          fi
          if find /tmp -maxdepth 1 -type d -name 'mk-codex-install.*' -print -quit | grep -q .; then
            echo '[BLOCK] Installer temporary residue remains.' >&2
            exit 1
          fi
          echo '[PASS] Qualification runtime, staging, principals and disposable state were destroyed.'
